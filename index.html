<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090a0d">
<title>REAPER SQUAD ESPORTS</title>
<style>
:root{--bg:#090a0d;--panel:#12151b;--panel2:#191e27;--gold:#d7ad55;--gold2:#f2d48a;--muted:#9aa2ad;--text:#f4f4f4;--line:#2b303a;--red:#df6262;--green:#62c995}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Microsoft YaHei",sans-serif}
header{padding:28px 16px 22px;text-align:center;background:radial-gradient(ellipse at top,#29200f 0,#11110f 42%,#090a0d 78%);border-bottom:1px solid #574321}
.logo{font-size:clamp(22px,5vw,34px);font-weight:900;letter-spacing:4px;color:var(--gold2)}
.subtitle{margin-top:8px;color:var(--muted);font-size:11px;letter-spacing:4px}
.authbar{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin-top:17px}
#loginStatus{font-size:12px;color:var(--muted)}
nav{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:13px;background:#0d1015;border-bottom:1px solid var(--line)}
button{border:1px solid var(--gold);border-radius:6px;padding:10px 15px;background:var(--gold);color:#17130a;font-weight:700;cursor:pointer}
button:hover{filter:brightness(1.12)}
button.secondary{background:transparent;color:var(--gold)}
button.danger{background:#492020;border-color:#843c3c;color:#fff}
button.small{padding:6px 10px;font-size:12px}
button:disabled{opacity:.5;cursor:not-allowed}
.tab-btn{background:transparent;border-color:var(--line);color:var(--muted)}
.tab-btn.active{background:var(--gold);border-color:var(--gold);color:#17130a}
main{max-width:1150px;margin:24px auto;padding:0 14px 50px}
.tab{display:none}.tab.active{display:block}
h2{font-size:20px;color:var(--gold2);margin:8px 0 16px}
h3{margin:0 0 12px;color:var(--gold2);font-size:16px}
.panel,.team-card,.match-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:15px}
.muted,.hint{color:var(--muted);font-size:12px}
.empty{text-align:center;padding:28px;color:var(--muted)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:540px}
th,td{padding:11px 9px;text-align:center;border-bottom:1px solid var(--line);font-size:13px}
th{color:var(--gold2);background:#191d24}
.rank{color:var(--gold2);font-weight:800}
input,select{width:100%;padding:10px 11px;margin:6px 0 12px;border:1px solid #343b46;border-radius:6px;background:#0b0e13;color:#fff;font:inherit}
input:focus,select:focus{outline:1px solid var(--gold);border-color:var(--gold)}
label{display:block;color:var(--muted);font-size:12px;margin-top:8px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.team-card h3,.match-card h3{margin-bottom:7px}
.player-list{color:var(--muted);font-size:13px;line-height:1.8}
.round-box{padding:12px;margin:12px 0;border:1px solid var(--line);border-radius:8px;background:#0d1117}
.round-title{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;color:var(--gold2);font-weight:700}
.result-row{display:grid;grid-template-columns:minmax(120px,1fr) 90px 90px;gap:8px;align-items:center;margin:7px 0}
.result-row input{margin:0}
.result-row .team-label{font-size:13px}
.checkline{display:flex;align-items:center;gap:8px;margin:7px 0;color:var(--text);font-size:13px}
.checkline input{width:auto;margin:0}
.hidden{display:none!important}
.notice{padding:11px;border-radius:7px;background:#211b10;border:1px solid #594523;color:var(--gold2);font-size:13px;margin-bottom:14px}
.error{color:#ff8c8c}.success{color:var(--green)}
footer{text-align:center;color:#69717c;font-size:11px;padding:22px}
@media(max-width:650px){main{margin:16px auto}.form-grid{grid-template-columns:1fr}.panel{padding:13px}.result-row{grid-template-columns:minmax(90px,1fr) 70px 70px}.result-row input{padding:8px 5px;font-size:12px}.logo{letter-spacing:2px}nav{gap:6px}nav button{padding:9px 10px;font-size:12px}}
</style>
</head>
<body>
<header>
  <div class="logo">REAPER SQUAD</div>
  <div class="subtitle">ESPORTS MANAGEMENT SYSTEM</div>
  <div class="authbar">
    <span id="loginStatus">访客模式 · 仅可查看</span>
    <button id="loginBtn" onclick="signIn()">Google 登录</button>
    <button id="logoutBtn" class="secondary hidden" onclick="signOutUser()">退出登录</button>
  </div>
</header>

<nav>
  <button class="tab-btn active" data-tab="boardTab" onclick="showTab('boardTab',this)">排行榜</button>
  <button class="tab-btn" data-tab="matchesTab" onclick="showTab('matchesTab',this)">比赛记录</button>
  <button class="tab-btn" data-tab="teamsTab" onclick="showTab('teamsTab',this)">队伍名单</button>
  <button class="tab-btn hidden" id="adminNav" data-tab="adminTab" onclick="showTab('adminTab',this)">管理中心</button>
</nav>

<main>
  <section id="boardTab" class="tab active">
    <h2>🏆 战队积分排行榜</h2>
    <div class="panel"><div id="leaderboard" class="empty">正在加载数据...</div></div>
  </section>

  <section id="matchesTab" class="tab">
    <h2>比赛记录</h2>
    <div id="matchList"></div>
  </section>

  <section id="teamsTab" class="tab">
    <h2>参赛队伍</h2>
    <div id="teamList"></div>
  </section>

  <section id="adminTab" class="tab">
    <h2>管理中心</h2>
    <div id="adminPanel" class="hidden">
      <div class="notice">管理员权限已按原管理员 UID 验证。普通用户及访客仅可查看。</div>
      <div class="panel">
        <h3>队伍管理</h3>
        <input id="editingTeamId" type="hidden">
        <label>队伍名称</label><input id="teamName" maxlength="40" placeholder="输入队伍名称">
        <div class="form-grid">
          <div><label>队员 1</label><input id="player1" maxlength="35" placeholder="队员昵称"></div>
          <div><label>队员 2</label><input id="player2" maxlength="35" placeholder="队员昵称"></div>
          <div><label>队员 3</label><input id="player3" maxlength="35" placeholder="队员昵称"></div>
          <div><label>队员 4</label><input id="player4" maxlength="35" placeholder="队员昵称"></div>
        </div>
        <div class="actions">
          <button onclick="saveTeam()">保存队伍</button>
          <button class="secondary" onclick="resetTeamForm()">清空</button>
        </div>
      </div>

      <div class="panel">
        <h3 id="matchFormTitle">新增比赛（五局）</h3>
        <input id="editingMatchId" type="hidden">
        <label>比赛名称</label><input id="matchName" maxlength="70" placeholder="例如：REAPER WEEK 01">
        <label>比赛日期</label><input id="matchDate" type="date">
        <div id="roundsContainer"></div>
        <div class="actions">
          <button onclick="saveMatch()">保存比赛</button>
          <button class="secondary" onclick="resetMatchForm()">清空表单</button>
        </div>
      </div>

      <div class="panel">
        <h3>已保存比赛管理</h3>
        <div id="adminMatchList"></div>
      </div>
    </div>
    <div id="adminDenied" class="panel muted">此页面仅对原管理员 UID 开放。请使用管理员 Google 账号登录。</div>
  </section>
</main>
<footer>REAPER SQUAD ESPORTS · OFFICIAL MANAGEMENT</footer>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,getDocs,addDoc,setDoc,deleteDoc,serverTimestamp,query,orderBy} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* 原 Firebase 项目配置：保持不变 */
const firebaseConfig={
  apiKey:"AIzaSyDekPmstKjjWb-CDyRhJ6a4w6hKAm1CyW",
  authDomain:"reaper-squad-esportss.firebaseapp.com",
  projectId:"reaper-squad-esportss",
  storageBucket:"reaper-squad-esportss.firebasestorage.app",
  messagingSenderId:"648536201607",
  appId:"1:648536201607:web:f2457dbb87c5d572181b22",
  measurementId:"G-MRKCHJ6B6E"
};

/* 原管理员 UID：不增加、不更换 */
const ADMIN_UID="GmkehgoarFPEZk1Hmnl8Dh0X3Ui2";
const MAPS=["Erangel","Miramar","Sanhok","Vikendi","Livik","Rondo"];
const PLACE_POINTS={1:10,2:6,3:5,4:4,5:3,6:2,7:1,8:1};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const provider=new GoogleAuthProvider();

let currentUser=null,isAdmin=false,teams=[],matches=[],roundSelections=[];

window.showTab=(id,button)=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  document.querySelectorAll(".tab-btn").forEach(x=>x.classList.remove("active"));
  document.getElementById(id)?.classList.add("active");
  button?.classList.add("active");
};

window.signIn=async()=>{
  try{await signInWithPopup(auth,provider)}
  catch(e){alert("登录失败："+friendlyError(e))}
};
window.signOutUser=async()=>{
  try{await signOut(auth)}catch(e){alert("退出失败："+friendlyError(e))}
};

function friendlyError(e){
  const code=e?.code||"";
  if(code.includes("unauthorized-domain"))return "当前网站域名未加入 Firebase Authentication 的授权网域。";
  if(code.includes("popup-blocked"))return "登录弹窗被浏览器阻止，请允许弹窗后重试。";
  if(code.includes("permission-denied"))return "Firestore 权限不足，请检查数据库安全规则。";
  return e?.message||"未知错误";
}
function requireAdmin(){
  if(!isAdmin)throw new Error("当前账号没有管理员权限。");
}
function escapeHtml(value){
  return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function dateValue(v){
  if(!v)return "";
  if(typeof v==="string")return v;
  if(v.toDate)return v.toDate().toLocaleDateString("zh-CN");
  return "";
}

onAuthStateChanged(auth,async user=>{
  currentUser=user;
  isAdmin=!!user&&user.uid===ADMIN_UID;
  document.getElementById("loginBtn").classList.toggle("hidden",!!user);
  document.getElementById("logoutBtn").classList.toggle("hidden",!user);
  document.getElementById("adminNav").classList.toggle("hidden",!isAdmin);
  document.getElementById("adminPanel").classList.toggle("hidden",!isAdmin);
  document.getElementById("adminDenied").classList.toggle("hidden",isAdmin);
  document.getElementById("loginStatus").textContent=user
    ? (isAdmin?"管理员已登录":"已登录 · 访客查看权限")
    : "访客模式 · 仅可查看";
  await loadAll();
});

async function loadAll(){
  try{
    const [teamSnap,matchSnap]=await Promise.all([
      getDocs(collection(db,"teams")),
      getDocs(collection(db,"matches"))
    ]);
    teams=teamSnap.docs.map(d=>({id:d.id,...d.data()}));
    matches=matchSnap.docs.map(d=>({id:d.id,...d.data()}));
    matches.sort((a,b)=>{
      const ta=a.createdAt?.toMillis?.()||0,tb=b.createdAt?.toMillis?.()||0;
      return tb-ta;
    });
    renderAll();
  }catch(e){
    console.error(e);
    document.getElementById("leaderboard").innerHTML=
      `<div class="error">读取数据失败：${escapeHtml(friendlyError(e))}<br><small>请确认 Firestore 已启用，并允许公开读取 teams 和 matches。</small></div>`;
    document.getElementById("teamList").innerHTML="";
    document.getElementById("matchList").innerHTML="";
  }
}

function getRoundResults(match){
  if(Array.isArray(match.rounds))return match.rounds;
  if(Array.isArray(match.results))return [{map:"旧版记录",results:match.results}];
  return [];
}
function scoreForPlacement(place){return PLACE_POINTS[Number(place)]||0}
function aggregate(){
  const stats={};
  teams.forEach(t=>stats[t.id]={team:t,points:0,kills:0,matches:0,wins:0,rounds:0});
  matches.forEach(m=>{
    const seen=new Set();
    getRoundResults(m).forEach(round=>{
      (round.results||[]).forEach(r=>{
        const team=teams.find(t=>t.name===r.team);
        if(!team)return;
        const s=stats[team.id];if(!s)return;
        s.points+=scoreForPlacement(r.placement)+Math.max(0,Number(r.kills)||0);
        s.kills+=Math.max(0,Number(r.kills)||0);
        s.rounds++;
        if(Number(r.placement)===1)s.wins++;
        seen.add(team.id);
      });
    });
    seen.forEach(id=>stats[id].matches++);
  });
  return Object.values(stats).sort((a,b)=>b.points-a.points||b.kills-a.kills);
}
function renderAll(){
  renderLeaderboard();renderTeams();renderMatches();if(isAdmin)renderAdminMatches();
}
function renderLeaderboard(){
  const list=aggregate();
  if(!list.length){document.getElementById("leaderboard").innerHTML='<div class="empty">暂无队伍数据</div>';return}
  document.getElementById("leaderboard").innerHTML=`<div class="table-wrap"><table>
    <thead><tr><th>排名</th><th>队伍</th><th>总积分</th><th>淘汰</th><th>冠军局</th><th>参赛场次</th></tr></thead>
    <tbody>${list.map((s,i)=>`<tr><td class="rank">#${i+1}</td><td>${escapeHtml(s.team.name)}</td><td><b>${s.points}</b></td><td>${s.kills}</td><td>${s.wins}</td><td>${s.matches}</td></tr>`).join("")}</tbody>
  </table></div><p class="hint">积分 = 排名积分 + 淘汰数。排名积分：第1名10分、第2名6分、第3名5分、第4名4分、第5名3分、第6名2分、第7–8名各1分。</p>`;
}
function renderTeams(){
  const el=document.getElementById("teamList");
  if(!teams.length){el.innerHTML='<div class="empty">暂无队伍</div>';return}
  el.innerHTML=teams.slice().sort((a,b)=>(a.name||"").localeCompare(b.name||"")).map(t=>
    `<div class="team-card"><h3>${escapeHtml(t.name)}</h3><div class="player-list">${(t.players||[]).map((p,i)=>`${i+1}. ${escapeHtml(p)}`).join("<br>")}</div>
    ${isAdmin?`<div class="actions"><button class="secondary small" onclick="editTeam('${t.id}')">编辑</button><button class="danger small" onclick="deleteTeam('${t.id}')">删除</button></div>`:""}</div>`
  ).join("");
}
function renderMatches(){
  const el=document.getElementById("matchList");
  if(!matches.length){el.innerHTML='<div class="empty">暂无比赛记录</div>';return}
  el.innerHTML=matches.map(m=>{
    const rounds=getRoundResults(m);
    const totalKills=rounds.reduce((n,r)=>n+(r.results||[]).reduce((a,x)=>a+(Number(x.kills)||0),0),0);
    return `<div class="match-card"><h3>${escapeHtml(m.name||"未命名比赛")}</h3>
      <div class="muted">${escapeHtml(dateValue(m.date)||"未设置日期")} · ${rounds.length} 局 · 总淘汰 ${totalKills}</div>
      ${rounds.map((r,i)=>`<div class="round-box"><div class="round-title"><span>第 ${i+1} 局 · ${escapeHtml(r.map||"未设置地图")}</span></div>
        ${renderRoundTable(r.results||[])}</div>`).join("")}
    </div>`;
  }).join("");
}
function renderRoundTable(results){
  if(!results.length)return '<div class="muted">本局暂无结果</div>';
  return `<div class="table-wrap"><table><thead><tr><th>队伍</th><th>排名</th><th>淘汰</th><th>积分</th></tr></thead><tbody>
  ${results.slice().sort((a,b)=>(Number(a.placement)||99)-(Number(b.placement)||99)).map(r=>
    `<tr><td>${escapeHtml(r.team)}</td><td>${escapeHtml(r.placement)}</td><td>${Number(r.kills)||0}</td><td>${scoreForPlacement(r.placement)+(Number(r.kills)||0)}</td></tr>`
  ).join("")}</tbody></table></div>`;
}

function renderRounds(){
  const container=document.getElementById("roundsContainer");
  container.innerHTML="";
  for(let i=0;i<5;i++){
    const round=roundSelections[i]||{map:MAPS[i%MAPS.length],results:[]};
    const box=document.createElement("div");
    box.className="round-box";
    box.innerHTML=`<div class="round-title"><span>第 ${i+1} 局</span>
      <select id="map${i}" aria-label="第${i+1}局地图">${MAPS.map(m=>`<option ${m===round.map?"selected":""}>${m}</option>`).join("")}</select>
    </div><div id="roundRows${i}"></div>`;
    container.appendChild(box);
    const rows=box.querySelector(`#roundRows${i}`);
    const saved=new Map((round.results||[]).map(r=>[r.team,r]));
    teams.forEach(team=>{
      const old=saved.get(team.name)||{};
      const row=document.createElement("div");
      row.className="result-row";
      row.innerHTML=`<span class="team-label">${escapeHtml(team.name)}</span>
        <input type="number" min="1" max="99" step="1" placeholder="排名" value="${old.placement??""}" data-team="${escapeHtml(team.name)}" data-field="placement">
        <input type="number" min="0" max="99" step="1" placeholder="淘汰" value="${old.kills??""}" data-team="${escapeHtml(team.name)}" data-field="kills">`;
      rows.appendChild(row);
    });
    if(!teams.length)rows.innerHTML='<div class="muted">请先建立队伍，再录入比赛成绩。</div>';
  }
}
function collectRounds(){
  const rounds=[];
  for(let i=0;i<5;i++){
    const results=[];
    const rows=document.querySelectorAll(`#roundRows${i} .result-row`);
    const usedPlaces=new Set();
    rows.forEach(row=>{
      const team=row.querySelector('[data-field="placement"]').dataset.team;
      const placeRaw=row.querySelector('[data-field="placement"]').value.trim();
      const killsRaw=row.querySelector('[data-field="kills"]').value.trim();
      if(!placeRaw&&!killsRaw)return;
      if(!placeRaw||!killsRaw)throw new Error(`第 ${i+1} 局：${team} 的排名和淘汰数必须同时填写。`);
      const placement=Number(placeRaw),kills=Number(killsRaw);
      if(!Number.isInteger(placement)||placement<1||placement>99)throw new Error(`第 ${i+1} 局：${team} 的排名必须是 1–99 的整数。`);
      if(!Number.isInteger(kills)||kills<0||kills>99)throw new Error(`第 ${i+1} 局：${team} 的淘汰数必须是 0–99 的整数。`);
      if(usedPlaces.has(placement))throw new Error(`第 ${i+1} 局排名 ${placement} 重复，请检查。`);
      usedPlaces.add(placement);
      results.push({team,participants:[],placement,kills});
    });
    rounds.push({map:document.getElementById(`map${i}`).value,results});
  }
  return rounds;
}
window.saveTeam=async()=>{
  try{
    requireAdmin();
    const name=document.getElementById("teamName").value.trim();
    const players=[1,2,3,4].map(i=>document.getElementById("player"+i).value.trim());
    if(!name)throw new Error("请输入队伍名称。");
    if(players.some(p=>!p))throw new Error("请填写完整四名队员。");
    if(new Set(players).size!==4)throw new Error("同一队伍的四名队员昵称不能重复。");
    const editingId=document.getElementById("editingTeamId").value;
    const duplicate=teams.find(t=>t.name.toLowerCase()===name.toLowerCase()&&t.id!==editingId);
    if(duplicate)throw new Error("队伍名称已存在。");
    const data={name,players,updatedAt:serverTimestamp()};
    if(editingId)await setDoc(doc(db,"teams",editingId),data,{merge:true});
    else await addDoc(collection(db,"teams"),data);
    resetTeamForm();await loadAll();alert("队伍已保存。");
  }catch(e){alert(e.message||friendlyError(e))}
};
window.resetTeamForm=()=>{
  document.getElementById("editingTeamId").value="";
  document.getElementById("teamName").value="";
  [1,2,3,4].forEach(i=>document.getElementById("player"+i).value="");
};
window.editTeam=function editTeam(id){
  requireAdmin();
  const t=teams.find(x=>x.id===id);if(!t)return;
  document.getElementById("editingTeamId").value=t.id;
  document.getElementById("teamName").value=t.name||"";
  [1,2,3,4].forEach(i=>document.getElementById("player"+i).value=t.players?.[i-1]||"");
  showTab("adminTab",document.getElementById("adminNav"));
  document.getElementById("teamName").focus();
}
window.deleteTeam=async function deleteTeam(id){
  try{
    requireAdmin();
    const t=teams.find(x=>x.id===id);if(!t)return;
    if(!confirm(`确定删除队伍「${t.name}」？历史比赛中的队伍记录不会自动删除。`))return;
    await deleteDoc(doc(db,"teams",id));await loadAll();
  }catch(e){alert(e.message||friendlyError(e))}
}
function renderAdminMatches(){
  const el=document.getElementById("adminMatchList");
  el.innerHTML=matches.length?matches.map(m=>`<div class="team-card">
    <b>${escapeHtml(m.name||"未命名比赛")}</b><div class="muted">${escapeHtml(dateValue(m.date))}</div>
    <div class="actions"><button class="secondary small" onclick="editMatch('${m.id}')">编辑</button>
    <button class="danger small" onclick="deleteMatch('${m.id}')">删除</button></div>
  </div>`).join(""):'<div class="empty">暂无比赛</div>';
}
window.editMatch=id=>{
  try{
    requireAdmin();
    const m=matches.find(x=>x.id===id);if(!m)return;
    document.getElementById("editingMatchId").value=m.id;
    document.getElementById("matchName").value=m.name||"";
    document.getElementById("matchDate").value=typeof m.date==="string"?m.date:"";
    const old=getRoundResults(m);
    roundSelections=Array.from({length:5},(_,i)=>old[i]||{map:MAPS[i],results:[]});
    document.getElementById("matchFormTitle").textContent="编辑比赛（五局）";
    renderRounds();showTab("adminTab",document.getElementById("adminNav"));
    document.getElementById("matchName").focus();
  }catch(e){alert(e.message)}
};
window.deleteMatch=async id=>{
  try{
    requireAdmin();
    const m=matches.find(x=>x.id===id);if(!m)return;
    if(!confirm(`确定删除比赛「${m.name||"未命名比赛"}」？此操作无法撤销。`))return;
    await deleteDoc(doc(db,"matches",id));await loadAll();
  }catch(e){alert(e.message||friendlyError(e))}
};
window.resetMatchForm=()=>{
  document.getElementById("editingMatchId").value="";
  document.getElementById("matchName").value="";
  document.getElementById("matchDate").value=new Date().toISOString().slice(0,10);
  document.getElementById("matchFormTitle").textContent="新增比赛（五局）";
  roundSelections=Array.from({length:5},(_,i)=>({map:MAPS[i],results:[]}));
  renderRounds();
};
window.saveMatch=async()=>{
  try{
    requireAdmin();
    const name=document.getElementById("matchName").value.trim();
    const date=document.getElementById("matchDate").value;
    if(!name)throw new Error("请输入比赛名称。");
    if(!date)throw new Error("请选择比赛日期。");
    if(!teams.length)throw new Error("请先建立至少一支队伍。");
    const rounds=collectRounds();
    if(!rounds.some(r=>r.results.length))throw new Error("请至少录入一局比赛成绩。");
    const editingId=document.getElementById("editingMatchId").value;
    const data={name,date,rounds,createdBy:currentUser.uid,updatedAt:serverTimestamp()};
    if(editingId)await setDoc(doc(db,"matches",editingId),data,{merge:true});
    else await addDoc(collection(db,"matches"),{...data,createdAt:serverTimestamp()});
    resetMatchForm();await loadAll();alert("比赛已保存。");
  }catch(e){alert(e.message||friendlyError(e))}
};

window.addEventListener("error",e=>console.error("页面错误：",e.error));
document.getElementById("matchDate").value=new Date().toISOString().slice(0,10);
roundSelections=Array.from({length:5},(_,i)=>({map:MAPS[i],results:[]}));
renderRounds();
</script>
